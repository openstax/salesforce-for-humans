title: "Salesforce for Humans"
description: "How OpenStax Manages Relationships, Tracks Its Mission, and Turns Data Into Impact"
url: "https://openstax.github.io"
baseurl: "/salesforce-for-humans"

markdown: kramdown

plugins:
  - jekyll-redirect-from
highlighter: rouge

collections:
  modules:
    output: true
    permalink: /modules/:slug/
    sort_by: number

defaults:
  - scope:
      path: ""
      type: "modules"
    values:
      layout: "module"

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

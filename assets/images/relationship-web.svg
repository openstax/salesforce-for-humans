<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="560" fill="#F7F8FA" rx="8"/>

  <!-- Title -->
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">The OpenStax Relationship Web</text>
  <text x="400" y="46" fill="#9A9A9B" font-size="10" text-anchor="middle">One pull on the thread and the whole picture emerges</text>

  <!-- === CONNECTION LINES (draw first, behind nodes) === -->
  <!-- Account to Contacts -->
  <line x1="200" y1="168" x2="200" y2="260" stroke="#77AF42" stroke-width="2" opacity="0.4"/>
  <!-- Account to Cases -->
  <line x1="200" y1="168" x2="550" y2="148" stroke="#0C9372" stroke-width="2" opacity="0.4"/>
  <!-- Account to Campaigns -->
  <line x1="200" y1="168" x2="630" y2="288" stroke="#FDBD3E" stroke-width="2" opacity="0.4"/>

  <!-- Contact to Opportunities -->
  <line x1="200" y1="310" x2="200" y2="390" stroke="#F47641" stroke-width="2" opacity="0.4"/>
  <!-- Contact to Cases -->
  <line x1="240" y1="288" x2="520" y2="148" stroke="#0C9372" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,3"/>
  <!-- Contact to Campaigns -->
  <line x1="240" y1="288" x2="600" y2="288" stroke="#FDBD3E" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,3"/>

  <!-- Opportunity to Adoptions -->
  <line x1="200" y1="440" x2="200" y2="490" stroke="#0DC0DC" stroke-width="2" opacity="0.4"/>

  <!-- Campaign to CampaignMember junction hint -->
  <line x1="600" y1="288" x2="350" y2="288" stroke="#FDBD3E" stroke-width="1.5" opacity="0.2" stroke-dasharray="3,4"/>

  <!-- === ACCOUNT NODE (top center-left) === -->
  <rect x="100" y="100" width="200" height="70" rx="8" fill="#0D2C6C"/>
  <rect x="104" y="104" width="192" height="62" rx="6" fill="#0D2C6C" stroke="#77AF42" stroke-width="1.5"/>
  <text x="200" y="125" fill="rgba(255,255,255,0.6)" font-size="9" text-anchor="middle">ACCOUNT</text>
  <text x="200" y="145" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">Cedar Bluff Community College</text>
  <text x="200" y="160" fill="rgba(255,255,255,0.5)" font-size="9" text-anchor="middle">Higher ed · Canvas · 2-year</text>

  <!-- Relationship label: has many -->
  <rect x="158" y="178" width="84" height="16" rx="8" fill="#77AF42"/>
  <text x="200" y="190" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">has many ▼</text>

  <!-- === CONTACT NODES === -->
  <rect x="60" y="260" width="280" height="56" rx="6" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <text x="80" y="278" fill="#9A9A9B" font-size="8" font-weight="700">CONTACTS</text>

  <circle cx="92" cy="300" r="10" fill="#0D2C6C"/>
  <text x="92" y="303" fill="#fff" font-size="7" font-weight="700" text-anchor="middle">MR</text>
  <text x="108" y="302" fill="#2d2d2d" font-size="10" font-weight="700">Dr. Maya Rivera</text>
  <text x="204" y="302" fill="#9A9A9B" font-size="8">1 - Champion</text>

  <circle cx="268" cy="300" r="10" fill="#0D2C6C"/>
  <text x="268" y="303" fill="#fff" font-size="7" font-weight="700" text-anchor="middle">+3</text>
  <text x="284" y="302" fill="#2d2d2d" font-size="9">more</text>

  <!-- Relationship label -->
  <rect x="158" y="322" width="84" height="16" rx="8" fill="#F47641"/>
  <text x="200" y="334" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">has many ▼</text>

  <!-- === OPPORTUNITY NODE === -->
  <rect x="60" y="390" width="280" height="52" rx="6" fill="#fff" stroke="#F47641" stroke-width="2"/>
  <text x="80" y="408" fill="#9A9A9B" font-size="8" font-weight="700">OPPORTUNITIES</text>
  <text x="80" y="426" fill="#2d2d2d" font-size="10" font-weight="700">A&amp;P 2e · Book Opp</text>
  <text x="240" y="426" fill="#77AF42" font-size="10" font-weight="700">Active</text>

  <!-- Relationship label -->
  <rect x="158" y="448" width="84" height="16" rx="8" fill="#0DC0DC"/>
  <text x="200" y="460" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">has many ▼</text>


  <text x="80" y="523" fill="#2d2d2d" font-size="9">2024 - 25 · 180 students</text>
  <text x="80" y="535" fill="#2d2d2d" font-size="9">2025 - 26 · 195 students</text>
  <text x="230" y="523" fill="#77AF42" font-size="9" font-weight="700">Confirmed</text>
  <text x="230" y="535" fill="#77AF42" font-size="9" font-weight="700">Confirmed</text>

  <!-- === CASE NODE (right side) === -->
  <rect x="440" y="100" width="230" height="56" rx="6" fill="#fff" stroke="#0C9372" stroke-width="2"/>
  <text x="460" y="118" fill="#9A9A9B" font-size="8" font-weight="700">CASES</text>
  <text x="460" y="136" fill="#2d2d2d" font-size="10" font-weight="700">Instructor resource access</text>
  <text x="460" y="148" fill="#77AF42" font-size="9">Resolved · Same day</text>

  <!-- === CAMPAIGN NODE (right side) === -->
  <rect x="440" y="240" width="300" height="100" rx="6" fill="#fff" stroke="#FDBD3E" stroke-width="2"/>
  <text x="460" y="258" fill="#9A9A9B" font-size="8" font-weight="700">CAMPAIGNS</text>

  <rect x="456" y="266" width="270" height="20" rx="3" fill="#FFF9E5"/>
  <text x="464" y="280" fill="#2d2d2d" font-size="9" font-weight="700">Spring 2026 HE Semester Engagement</text>

  <text x="476" y="300" fill="#2d2d2d" font-size="9">HE Engagement Email Series</text>
  <text x="630" y="300" fill="#9A9A9B" font-size="8">Sent → Opened</text>

  <text x="476" y="316" fill="#2d2d2d" font-size="9">A&amp;P Webinar</text>
  <text x="630" y="316" fill="#9A9A9B" font-size="8">Registered → Attended</text>

  <text x="476" y="332" fill="#9A9A9B" font-size="9" font-style="italic">Campaign Member statuses ↑</text>

  <!-- === TEAM BENEFIT BOXES (bottom right) === -->
  <text x="540" y="380" fill="#0D2C6C" font-size="11" font-weight="900">Every team sees a different slice:</text>

  <rect x="440" y="392" width="140" height="30" rx="4" fill="#E8F5F0"/>
  <text x="445" y="406" fill="#0C9372" font-size="9" font-weight="700">Support</text>
  <text x="445" y="418" fill="#5E6062" font-size="8">Full history on every call</text>

  <rect x="590" y="392" width="140" height="30" rx="4" fill="#FFF5EE"/>
  <text x="595" y="406" fill="#F47641" font-size="9" font-weight="700">Sales</text>
  <text x="595" y="418" fill="#5E6062" font-size="8">Pipeline + who to talk to</text>

  <rect x="440" y="428" width="140" height="30" rx="4" fill="#EDF7E1"/>
  <text x="445" y="442" fill="#5a8a2f" font-size="9" font-weight="700">Marketing</text>
  <text x="445" y="454" fill="#5E6062" font-size="8">Engagement + segmentation</text>

  <rect x="590" y="428" width="140" height="30" rx="4" fill="#EBF5FE"/>
  <text x="595" y="442" fill="#0D2C6C" font-size="9" font-weight="700">Web</text>
  <text x="595" y="454" fill="#5E6062" font-size="8">Signups, forms, renewals</text>

  <rect x="440" y="464" width="290" height="30" rx="4" fill="#FFF9E5"/>
  <text x="445" y="478" fill="#0D2C6C" font-size="9" font-weight="700">Leadership</text>
  <text x="530" y="478" fill="#5E6062" font-size="8">Impact numbers, pipeline forecasts, strategic planning</text>

  <text x="780" y="550" fill="#9A9A9B" font-size="8" text-anchor="end">Example data</text>
</svg>

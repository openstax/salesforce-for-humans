<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="520" fill="#F7F8FA" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">The Shared Brain: One System, Every Team</text>

  <!-- Center hub -->
  <circle cx="400" cy="270" r="72" fill="#0D2C6C"/>
  <circle cx="400" cy="270" r="68" fill="none" stroke="#77AF42" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="400" y="260" fill="#fff" font-size="16" font-weight="900" text-anchor="middle">Salesforce</text>
  <text x="400" y="280" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="middle">Shared Memory</text>

  <!-- Spokes (lines from center to nodes) -->
  <line x1="340" y1="220" x2="165" y2="120" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="460" y1="220" x2="635" y2="120" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="330" y1="285" x2="120" y2="310" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="470" y1="285" x2="680" y2="310" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="400" y1="342" x2="400" y2="430" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Support node (top-left) -->
  <circle cx="130" cy="100" r="44" fill="#fff" stroke="#0C9372" stroke-width="2.5"/>
  <text x="130" y="95" fill="#0C9372" font-size="13" font-weight="900" text-anchor="middle">Support</text>
  <text x="130" y="110" fill="#5E6062" font-size="9" text-anchor="middle">Cases · Call History</text>

  <!-- Data label on spoke -->
  <rect x="190" y="148" width="130" height="36" rx="4" fill="#E8F5F0"/>
  <text x="255" y="163" fill="#0C9372" font-size="9" text-anchor="middle">Full interaction history</text>
  <text x="255" y="176" fill="#0C9372" font-size="9" text-anchor="middle">on every call</text>

  <!-- Sales node (top-right) -->
  <circle cx="670" cy="100" r="44" fill="#fff" stroke="#F47641" stroke-width="2.5"/>
  <text x="670" y="95" fill="#F47641" font-size="13" font-weight="900" text-anchor="middle">Sales</text>
  <text x="670" y="110" fill="#5E6062" font-size="9" text-anchor="middle">Pipeline · Adoptions</text>

  <rect x="480" y="148" width="130" height="36" rx="4" fill="#FFF5EE"/>
  <text x="545" y="163" fill="#F47641" font-size="9" text-anchor="middle">Know what you're</text>
  <text x="545" y="176" fill="#F47641" font-size="9" text-anchor="middle">walking into</text>

  <!-- Marketing node (middle-left) -->
  <circle cx="80" cy="310" r="44" fill="#fff" stroke="#77AF42" stroke-width="2.5"/>
  <text x="80" y="302" fill="#77AF42" font-size="13" font-weight="900" text-anchor="middle">Marketing</text>
  <text x="80" y="317" fill="#5E6062" font-size="9" text-anchor="middle">Campaigns</text>
  <text x="80" y="329" fill="#5E6062" font-size="9" text-anchor="middle">Engagement</text>

  <rect x="140" y="275" width="135" height="36" rx="4" fill="#EDF7E1"/>
  <text x="207" y="290" fill="#5a8a2f" font-size="9" text-anchor="middle">Personalized outreach</text>
  <text x="207" y="303" fill="#5a8a2f" font-size="9" text-anchor="middle">based on real behavior</text>

  <!-- Web/Product node (middle-right) -->
  <circle cx="720" cy="310" r="44" fill="#fff" stroke="#0DC0DC" stroke-width="2.5"/>
  <text x="720" y="305" fill="#0D2C6C" font-size="13" font-weight="900" text-anchor="middle">Web</text>
  <text x="720" y="320" fill="#5E6062" font-size="9" text-anchor="middle">openstax.org</text>

  <rect x="525" y="275" width="135" height="36" rx="4" fill="#E8F8FB"/>
  <text x="592" y="290" fill="#0D2C6C" font-size="9" text-anchor="middle">Personalized experiences</text>
  <text x="592" y="303" fill="#0D2C6C" font-size="9" text-anchor="middle">from adoption data</text>

  <!-- Leadership node (bottom) -->
  <circle cx="400" cy="450" r="44" fill="#fff" stroke="#FDBD3E" stroke-width="2.5"/>
  <text x="400" y="443" fill="#0D2C6C" font-size="13" font-weight="900" text-anchor="middle">Leadership</text>
  <text x="400" y="458" fill="#5E6062" font-size="9" text-anchor="middle">Mission Impact</text>
  <text x="400" y="470" fill="#5E6062" font-size="9" text-anchor="middle">Strategy</text>

  <rect x="440" y="388" width="135" height="36" rx="4" fill="#FFF9E5"/>
  <text x="507" y="403" fill="#0D2C6C" font-size="9" text-anchor="middle">Students reached, savings</text>
  <text x="507" y="416" fill="#0D2C6C" font-size="9" text-anchor="middle">generated, pipeline health</text>

  <!-- Bottom message -->
  <rect x="150" y="500" width="500" height="2" rx="1" fill="#E5E7EB"/>
  <text x="400" y="516" fill="#9A9A9B" font-size="10" font-style="italic" text-anchor="middle">Every team reads from and writes to the same shared system. That's the whole point.</text>
</svg>

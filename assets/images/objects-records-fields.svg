<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="380" fill="#F7F8FA" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">The Entire Mental Model: Objects, Records, and Fields</text>

  <!-- Main table visualization -->
  <rect x="40" y="50" width="520" height="220" fill="#fff" rx="6" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Object label (table name) -->
  <rect x="40" y="50" width="520" height="34" fill="#0D2C6C" rx="6 6 0 0"/>
  <rect x="40" y="78" width="520" height="6" fill="#0D2C6C"/>
  <text x="60" y="72" fill="#fff" font-size="13" font-weight="900">Account</text>
  <text x="160" y="72" fill="rgba(255,255,255,0.5)" font-size="10">← This is the Object (the table)</text>

  <!-- Column headers = Fields -->
  <rect x="40" y="84" width="520" height="28" fill="#F7F8FA"/>
  <text x="56" y="102" fill="#0D2C6C" font-size="10" font-weight="700">Name</text>
  <text x="206" y="102" fill="#0D2C6C" font-size="10" font-weight="700">State</text>
  <text x="276" y="102" fill="#0D2C6C" font-size="10" font-weight="700">Type</text>
  <text x="370" y="102" fill="#0D2C6C" font-size="10" font-weight="700">LMS</text>
  <text x="460" y="102" fill="#0D2C6C" font-size="10" font-weight="700">KIP?</text>

  <!-- Column dividers -->
  <line x1="196" y1="84" x2="196" y2="270" stroke="#F0F0F0" stroke-width="1"/>
  <line x1="266" y1="84" x2="266" y2="270" stroke="#F0F0F0" stroke-width="1"/>
  <line x1="356" y1="84" x2="356" y2="270" stroke="#F0F0F0" stroke-width="1"/>
  <line x1="448" y1="84" x2="448" y2="270" stroke="#F0F0F0" stroke-width="1"/>

  <!-- Row 1 -->
  <line x1="40" y1="112" x2="560" y2="112" stroke="#E5E7EB" stroke-width="1"/>
  <text x="56" y="131" fill="#2d2d2d" font-size="10">Houston Comm College</text>
  <text x="206" y="131" fill="#2d2d2d" font-size="10">TX</text>
  <text x="276" y="131" fill="#2d2d2d" font-size="10">HE</text>
  <text x="370" y="131" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="460" y="131" fill="#2d2d2d" font-size="10">No</text>

  <!-- Row 2 — HIGHLIGHTED -->
  <line x1="40" y1="140" x2="560" y2="140" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="41" y="141" width="518" height="28" fill="#EDF7E1"/>
  <text x="56" y="160" fill="#2d2d2d" font-size="10" font-weight="700">Central Arizona College</text>
  <text x="206" y="160" fill="#2d2d2d" font-size="10">AZ</text>
  <text x="276" y="160" fill="#2d2d2d" font-size="10">HE</text>
  <text x="370" y="160" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="460" y="160" fill="#2d2d2d" font-size="10">Yes</text>

  <!-- Row 3 -->
  <line x1="40" y1="169" x2="560" y2="169" stroke="#E5E7EB" stroke-width="1"/>
  <text x="56" y="188" fill="#2d2d2d" font-size="10">Rice University</text>
  <text x="206" y="188" fill="#2d2d2d" font-size="10">TX</text>
  <text x="276" y="188" fill="#2d2d2d" font-size="10">HE</text>
  <text x="370" y="188" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="460" y="188" fill="#2d2d2d" font-size="10">No</text>

  <!-- Row 4 -->
  <line x1="40" y1="197" x2="560" y2="197" stroke="#E5E7EB" stroke-width="1"/>
  <text x="56" y="216" fill="#2d2d2d" font-size="10">Lone Star College</text>
  <text x="206" y="216" fill="#2d2d2d" font-size="10">TX</text>
  <text x="276" y="216" fill="#2d2d2d" font-size="10">HE</text>
  <text x="370" y="216" fill="#2d2d2d" font-size="10">Blackboard</text>
  <text x="460" y="216" fill="#2d2d2d" font-size="10">Yes</text>

  <!-- Row 5 -->
  <line x1="40" y1="225" x2="560" y2="225" stroke="#E5E7EB" stroke-width="1"/>
  <text x="56" y="244" fill="#9A9A9B" font-size="10">San Jacinto College</text>
  <text x="206" y="244" fill="#9A9A9B" font-size="10">TX</text>
  <text x="276" y="244" fill="#9A9A9B" font-size="10">HE</text>
  <text x="370" y="244" fill="#9A9A9B" font-size="10">D2L</text>
  <text x="460" y="244" fill="#9A9A9B" font-size="10">No</text>

  <!-- Annotation: Fields arrow (columns) -->
  <path d="M 56 84 L 56 76 L 505 76 L 505 84" fill="none" stroke="#F47641" stroke-width="1.5"/>
  <line x1="280" y1="76" x2="280" y2="62" stroke="#F47641" stroke-width="1.5" marker-end="url(#arrOr)"/>

  <!-- Annotation: Record arrow (highlighted row) -->
  <rect x="41" y="141" width="518" height="28" fill="none" stroke="#77AF42" stroke-width="2.5" rx="3"/>
  <line x1="560" y1="155" x2="590" y2="155" stroke="#77AF42" stroke-width="1.5"/>

  <!-- Legend boxes on the right -->
  <rect x="600" y="60" width="175" height="50" rx="6" fill="#FFF5EE" stroke="#F47641" stroke-width="1.5"/>
  <text x="616" y="80" fill="#F47641" font-size="12" font-weight="900">Fields</text>
  <text x="616" y="96" fill="#5E6062" font-size="10">= Columns. Each piece</text>
  <text x="616" y="108" fill="#5E6062" font-size="9">of info about a record.</text>

  <rect x="600" y="128" width="175" height="50" rx="6" fill="#EDF7E1" stroke="#77AF42" stroke-width="1.5"/>
  <text x="616" y="148" fill="#5a8a2f" font-size="12" font-weight="900">Record</text>
  <text x="616" y="164" fill="#5E6062" font-size="10">= One row. A specific</text>
  <text x="616" y="176" fill="#5E6062" font-size="9">institution, person, or case.</text>

  <rect x="600" y="196" width="175" height="50" rx="6" fill="#EBF5FE" stroke="#0D2C6C" stroke-width="1.5"/>
  <text x="616" y="216" fill="#0D2C6C" font-size="12" font-weight="900">Object</text>
  <text x="616" y="232" fill="#5E6062" font-size="10">= The whole table. A</text>
  <text x="616" y="244" fill="#5E6062" font-size="9">category of thing (Accounts).</text>

  <!-- Bottom summary -->
  <rect x="40" y="290" width="735" height="72" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>

  <g transform="translate(70, 310)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#0D2C6C"/>
    <text x="45" y="18" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Object</text>
  </g>
  <text x="180" y="328" fill="#5E6062" font-size="14">=</text>
  <text x="200" y="328" fill="#5E6062" font-size="11">Table</text>

  <text x="280" y="328" fill="#E5E7EB" font-size="14">|</text>

  <g transform="translate(310, 310)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#77AF42"/>
    <text x="45" y="18" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Record</text>
  </g>
  <text x="420" y="328" fill="#5E6062" font-size="14">=</text>
  <text x="440" y="328" fill="#5E6062" font-size="11">Row</text>

  <text x="500" y="328" fill="#E5E7EB" font-size="14">|</text>

  <g transform="translate(530, 310)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#F47641"/>
    <text x="45" y="18" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Field</text>
  </g>
  <text x="640" y="328" fill="#5E6062" font-size="14">=</text>
  <text x="660" y="328" fill="#5E6062" font-size="11">Column</text>

  <text x="400" y="354" fill="#9A9A9B" font-size="10" font-style="italic" text-anchor="middle">That's the entire mental model. Everything else is built on top of this.</text>

  <defs>
    <marker id="arrOr" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 6, 4 0, 8 6" fill="#F47641"/>
    </marker>
  </defs>
</svg>

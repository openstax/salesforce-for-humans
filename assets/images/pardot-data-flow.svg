<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="350" fill="#F7F8FA" rx="8"/>
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">The Two-Way Data Flow</text>
  <text x="400" y="44" fill="#9A9A9B" font-size="10" text-anchor="middle">Changes sync shortly, not instantly. The most recent edit wins, except pi__ fields, which Account Engagement owns.</text>

  <!-- Salesforce box (left) -->
  <rect x="40" y="70" width="280" height="200" fill="#fff" rx="8" stroke="#0D2C6C" stroke-width="2"/>
  <rect x="40" y="70" width="280" height="36" fill="#0D2C6C" rx="8 8 0 0"/>
  <rect x="40" y="100" width="280" height="6" fill="#0D2C6C"/>
  <text x="180" y="93" fill="#fff" font-size="13" font-weight="900" text-anchor="middle">Salesforce</text>

  <text x="60" y="126" fill="#0D2C6C" font-size="10" font-weight="700">What lives here:</text>
  <text x="60" y="144" fill="#5E6062" font-size="9">Contact &amp; Lead records</text>
  <text x="60" y="160" fill="#5E6062" font-size="9">Email, opt-out &amp; consent</text>
  <text x="60" y="176" fill="#5E6062" font-size="9">Adoption status &amp; school type</text>
  <text x="60" y="192" fill="#5E6062" font-size="9">Campaign membership</text>
  <text x="60" y="208" fill="#5E6062" font-size="9">Subject interest &amp; market segment</text>

  <rect x="56" y="222" width="248" height="30" rx="4" fill="#EBF5FE"/>
  <text x="180" y="241" fill="#0D2C6C" font-size="9" font-weight="700" text-anchor="middle">Your field updates here control who</text>
  <text x="180" y="253" fill="#0D2C6C" font-size="9" font-weight="700" text-anchor="middle">receives what marketing messages</text>

  <!-- Account Engagement box (right) -->
  <rect x="480" y="70" width="280" height="200" fill="#fff" rx="8" stroke="#0C9372" stroke-width="2"/>
  <rect x="480" y="70" width="280" height="36" fill="#0C9372" rx="8 8 0 0"/>
  <rect x="480" y="100" width="280" height="6" fill="#0C9372"/>
  <text x="620" y="93" fill="#fff" font-size="13" font-weight="900" text-anchor="middle">Account Engagement</text>

  <text x="500" y="126" fill="#0C9372" font-size="10" font-weight="700">What lives here:</text>
  <text x="500" y="144" fill="#5E6062" font-size="9">Engagement scores &amp; grades</text>
  <text x="500" y="160" fill="#5E6062" font-size="9">Email open, click, bounce data</text>
  <text x="500" y="176" fill="#5E6062" font-size="9">Category-level scoring</text>
  <text x="500" y="192" fill="#5E6062" font-size="9">Form submissions &amp; page views</text>
  <text x="500" y="208" fill="#5E6062" font-size="9">Bounces &amp; unsubscribes</text>

  <rect x="496" y="222" width="248" height="30" rx="4" fill="#E8F5F0"/>
  <text x="620" y="241" fill="#0C9372" font-size="9" font-weight="700" text-anchor="middle">pi__ fields on your Contact records</text>
  <text x="620" y="253" fill="#0C9372" font-size="9" font-weight="700" text-anchor="middle">come from here</text>

  <!-- Arrows between -->
  <!-- Right arrow (SF → AE) -->
  <rect x="335" y="110" width="130" height="36" rx="4" fill="#EDF7E1"/>
  <text x="400" y="124" fill="#5a8a2f" font-size="8" font-weight="700" text-anchor="middle">FIELD VALUES FLOW →</text>
  <text x="400" y="138" fill="#5E6062" font-size="8" text-anchor="middle">Email, opt-out, adoption,</text>
  <text x="400" y="148" fill="#5E6062" font-size="8" text-anchor="middle">subject interest, school type</text>
  <line x1="320" y1="128" x2="335" y2="128" stroke="#77AF42" stroke-width="2" marker-end="url(#flowR)"/>
  <line x1="465" y1="128" x2="480" y2="128" stroke="#77AF42" stroke-width="2" marker-end="url(#flowR)"/>

  <!-- Left arrow (AE → SF) -->
  <rect x="335" y="170" width="130" height="36" rx="4" fill="#FFF5EE"/>
  <text x="400" y="184" fill="#F47641" font-size="8" font-weight="700" text-anchor="middle">← SCORES FLOW BACK</text>
  <text x="400" y="196" fill="#5E6062" font-size="8" text-anchor="middle">Score, grade, activity,</text>
  <text x="400" y="206" fill="#5E6062" font-size="8" text-anchor="middle">bounce status (read-only)</text>
  <line x1="480" y1="188" x2="465" y2="188" stroke="#F47641" stroke-width="2" marker-end="url(#flowL)"/>
  <line x1="335" y1="188" x2="320" y2="188" stroke="#F47641" stroke-width="2" marker-end="url(#flowL)"/>

  <!-- Bottom message -->
  <rect x="100" y="284" width="600" height="50" rx="6" fill="#FFF9E5"/>
  <text x="400" y="302" fill="#0D2C6C" font-size="10" font-weight="700" text-anchor="middle">The data flows both directions. What you update in Salesforce changes what Account Engagement sends.</text>
  <text x="400" y="322" fill="#5E6062" font-size="9" text-anchor="middle">Last Activity does not move on email opens. Record opt-outs on the Contact and any open Lead.</text>

  <defs>
    <marker id="flowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#77AF42"/></marker>
    <marker id="flowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#F47641"/></marker>
  </defs>
</svg>

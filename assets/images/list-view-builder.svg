<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="380" fill="#F7F8FA" rx="8"/>

  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">A List View: a saved filter you can reuse</text>

  <rect x="20" y="44" width="760" height="300" fill="#fff" rx="6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="20" y="44" width="760" height="38" fill="#0D2C6C" rx="6"/>
  <rect x="20" y="76" width="760" height="6" fill="#0D2C6C"/>
  <text x="40" y="68" fill="#fff" font-size="13" font-weight="700">Accounts</text>

  <rect x="120" y="54" width="200" height="24" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="136" y="70" fill="#fff" font-size="10" font-weight="700">My A/B Fit Schools</text>
  <text x="304" y="70" fill="rgba(255,255,255,0.7)" font-size="10">▼</text>

  <rect x="340" y="56" width="50" height="20" rx="3" fill="rgba(255,255,255,0.1)"/>
  <text x="365" y="70" fill="rgba(255,255,255,0.7)" font-size="9" text-anchor="middle">+ New</text>

  <rect x="700" y="56" width="60" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="70" fill="rgba(255,255,255,0.8)" font-size="9" text-anchor="middle">Filters</text>

  <rect x="540" y="86" width="230" height="130" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="556" y="106" fill="#0D2C6C" font-size="10" font-weight="700">ACTIVE FILTERS</text>

  <rect x="556" y="114" width="198" height="22" rx="3" fill="#EDF7E1"/>
  <text x="564" y="129" fill="#3F6B1B" font-size="9">Filter by Owner: My accounts</text>
  <text x="740" y="129" fill="#6B6D6F" font-size="9">✕</text>

  <rect x="556" y="140" width="198" height="22" rx="3" fill="#EDF7E1"/>
  <text x="564" y="155" fill="#3F6B1B" font-size="9">Assignable Fit Tier is A or B</text>
  <text x="740" y="155" fill="#6B6D6F" font-size="9">✕</text>

  <rect x="556" y="166" width="198" height="22" rx="3" fill="#EDF7E1"/>
  <text x="564" y="181" fill="#3F6B1B" font-size="9">Record Type equals School</text>
  <text x="740" y="181" fill="#6B6D6F" font-size="9">✕</text>

  <text x="556" y="206" fill="#0C9372" font-size="9" font-weight="700">+ Add Filter</text>

  <rect x="26" y="86" width="504" height="26" fill="#F7F8FA"/>
  <text x="40" y="103" fill="#0D2C6C" font-size="10" font-weight="700">Account Name</text>
  <text x="270" y="103" fill="#0D2C6C" font-size="10" font-weight="700">LMS</text>
  <text x="380" y="103" fill="#0D2C6C" font-size="10" font-weight="700">Assignable Fit Tier</text>

  <text x="40" y="130" fill="#0C9372" font-size="10" font-weight="700">Cedar Bluff Community College</text>
  <text x="270" y="130" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="380" y="130" fill="#2d2d2d" font-size="10">A</text>
  <line x1="26" y1="138" x2="530" y2="138" stroke="#F0F0F0" stroke-width="1"/>

  <text x="40" y="157" fill="#0C9372" font-size="10">Lakeshore Technical College</text>
  <rect x="262" y="144" width="80" height="22" rx="3" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <text x="270" y="159" fill="#2d2d2d" font-size="10">D2L|</text>
  <text x="380" y="157" fill="#2d2d2d" font-size="10">B</text>
  <line x1="26" y1="165" x2="530" y2="165" stroke="#F0F0F0" stroke-width="1"/>

  <text x="40" y="184" fill="#0C9372" font-size="10">Pine Hollow Community College</text>
  <text x="270" y="184" fill="#2d2d2d" font-size="10">Moodle</text>
  <text x="380" y="184" fill="#2d2d2d" font-size="10">B</text>
  <line x1="26" y1="192" x2="530" y2="192" stroke="#F0F0F0" stroke-width="1"/>

  <text x="40" y="211" fill="#0C9372" font-size="10">Northgate State University</text>
  <text x="270" y="211" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="380" y="211" fill="#2d2d2d" font-size="10">A</text>

  <rect x="30" y="240" width="165" height="48" rx="4" fill="#EBF5FE" stroke="#0D2C6C" stroke-width="1"/>
  <text x="42" y="256" fill="#0D2C6C" font-size="9" font-weight="700">Descriptive name</text>
  <text x="42" y="270" fill="#5E6062" font-size="8">"My A/B Fit Schools" tells you</text>
  <text x="42" y="281" fill="#5E6062" font-size="8">more than "My View."</text>

  <rect x="215" y="240" width="165" height="48" rx="4" fill="#EDF7E1" stroke="#77AF42" stroke-width="1"/>
  <text x="227" y="256" fill="#3F6B1B" font-size="9" font-weight="700">Inline editing</text>
  <text x="227" y="270" fill="#5E6062" font-size="8">Click the pencil (or double-click)</text>
  <text x="227" y="281" fill="#5E6062" font-size="8">to fix a cell in the list.</text>

  <rect x="400" y="240" width="165" height="48" rx="4" fill="#FFF5EE" stroke="#F47641" stroke-width="1"/>
  <text x="412" y="256" fill="#9A4A1E" font-size="9" font-weight="700">Filters panel</text>
  <text x="412" y="270" fill="#5E6062" font-size="8">Narrow to what you need today.</text>
  <text x="412" y="281" fill="#5E6062" font-size="8">Saving keeps the filters.</text>

  <rect x="30" y="302" width="740" height="30" rx="6" fill="#EDF7E1"/>
  <text x="400" y="322" fill="#3F6B1B" font-size="11" font-weight="700" text-anchor="middle">Build two or three views in your first week. Example data.</text>
</svg>

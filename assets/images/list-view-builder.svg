<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="380" fill="#F7F8FA" rx="8"/>

  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">Your Most Powerful Daily Tool: List Views</text>

  <!-- Main frame -->
  <rect x="20" y="44" width="760" height="300" fill="#fff" rx="6" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Object header -->
  <rect x="20" y="44" width="760" height="38" fill="#0D2C6C" rx="6 6 0 0"/>
  <rect x="20" y="76" width="760" height="6" fill="#0D2C6C"/>
  <text x="40" y="68" fill="#fff" font-size="13" font-weight="700">Accounts</text>

  <!-- List view dropdown -->
  <rect x="120" y="54" width="200" height="24" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="136" y="70" fill="#fff" font-size="10" font-weight="700">My Texas HE Accounts</text>
  <text x="304" y="70" fill="rgba(255,255,255,0.6)" font-size="10">▼</text>

  <!-- New view button -->
  <rect x="340" y="56" width="50" height="20" rx="3" fill="rgba(255,255,255,0.1)"/>
  <text x="365" y="70" fill="rgba(255,255,255,0.5)" font-size="9" text-anchor="middle">+ New</text>

  <!-- Filter icon -->
  <rect x="700" y="56" width="60" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="70" fill="rgba(255,255,255,0.6)" font-size="9" text-anchor="middle">Filters</text>

  <!-- Filter panel (shown) -->
  <rect x="540" y="86" width="230" height="120" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="556" y="106" fill="#0D2C6C" font-size="10" font-weight="700">ACTIVE FILTERS</text>

  <rect x="556" y="114" width="198" height="22" rx="3" fill="#EDF7E1"/>
  <text x="564" y="129" fill="#5a8a2f" font-size="9">State = Texas</text>
  <text x="740" y="129" fill="#9A9A9B" font-size="9">✕</text>

  <rect x="556" y="140" width="198" height="22" rx="3" fill="#EDF7E1"/>
  <text x="564" y="155" fill="#5a8a2f" font-size="9">Type contains "College/University"</text>
  <text x="740" y="155" fill="#9A9A9B" font-size="9">✕</text>

  <rect x="556" y="168" width="100" height="22" rx="3" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="606" y="183" fill="#0C9372" font-size="9" font-weight="700" text-anchor="middle">+ Add Filter</text>

  <!-- Table header -->
  <rect x="26" y="86" width="504" height="26" fill="#F7F8FA"/>
  <text x="40" y="103" fill="#0D2C6C" font-size="10" font-weight="700">Account Name</text>
  <text x="200" y="103" fill="#0D2C6C" font-size="10" font-weight="700">State</text>
  <text x="260" y="103" fill="#0D2C6C" font-size="10" font-weight="700">Type</text>
  <text x="370" y="103" fill="#0D2C6C" font-size="10" font-weight="700">LMS</text>
  <text x="450" y="103" fill="#0D2C6C" font-size="10" font-weight="700">Active Opps</text>

  <!-- Row 1 -->
  <text x="40" y="130" fill="#0C9372" font-size="10" font-weight="700">Houston Community College</text>
  <text x="200" y="130" fill="#2d2d2d" font-size="10">TX</text>
  <text x="260" y="130" fill="#2d2d2d" font-size="10">HE</text>
  <text x="370" y="130" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="450" y="130" fill="#2d2d2d" font-size="10">4</text>
  <line x1="26" y1="138" x2="530" y2="138" stroke="#F0F0F0" stroke-width="1"/>

  <!-- Row 2 - inline editing indicator -->
  <text x="40" y="157" fill="#0C9372" font-size="10">Lone Star College</text>
  <text x="200" y="157" fill="#2d2d2d" font-size="10">TX</text>
  <text x="260" y="157" fill="#2d2d2d" font-size="10">HE</text>
  <!-- Inline edit field -->
  <rect x="365" y="144" width="70" height="22" rx="3" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <text x="373" y="159" fill="#2d2d2d" font-size="10">D2L</text>
  <text x="427" y="159" fill="#77AF42" font-size="9">|</text>
  <text x="450" y="157" fill="#2d2d2d" font-size="10">7</text>
  <line x1="26" y1="165" x2="530" y2="165" stroke="#F0F0F0" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="40" y="184" fill="#0C9372" font-size="10">San Jacinto College</text>
  <text x="200" y="184" fill="#2d2d2d" font-size="10">TX</text>
  <text x="260" y="184" fill="#2d2d2d" font-size="10">HE</text>
  <text x="370" y="184" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="450" y="184" fill="#2d2d2d" font-size="10">3</text>
  <line x1="26" y1="192" x2="530" y2="192" stroke="#F0F0F0" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="40" y="211" fill="#0C9372" font-size="10">Rice University</text>
  <text x="200" y="211" fill="#2d2d2d" font-size="10">TX</text>
  <text x="260" y="211" fill="#2d2d2d" font-size="10">HE</text>
  <text x="370" y="211" fill="#2d2d2d" font-size="10">Canvas</text>
  <text x="450" y="211" fill="#2d2d2d" font-size="10">2</text>

  <!-- Annotation callouts -->
  <rect x="30" y="240" width="165" height="44" rx="4" fill="#EBF5FE" stroke="#0D2C6C" stroke-width="1"/>
  <text x="42" y="256" fill="#0D2C6C" font-size="9" font-weight="700">Custom View Name</text>
  <text x="42" y="270" fill="#5E6062" font-size="8">Be descriptive. "My Texas HE</text>
  <text x="42" y="280" fill="#5E6062" font-size="8">Accounts" beats "My View."</text>

  <rect x="215" y="240" width="155" height="44" rx="4" fill="#EDF7E1" stroke="#77AF42" stroke-width="1"/>
  <text x="227" y="256" fill="#5a8a2f" font-size="9" font-weight="700">Inline Editing</text>
  <text x="227" y="270" fill="#5E6062" font-size="8">Double-click any field to edit</text>
  <text x="227" y="280" fill="#5E6062" font-size="8">without opening the record.</text>

  <rect x="390" y="240" width="155" height="44" rx="4" fill="#FFF5EE" stroke="#F47641" stroke-width="1"/>
  <text x="402" y="256" fill="#F47641" font-size="9" font-weight="700">Filters Panel</text>
  <text x="402" y="270" fill="#5E6062" font-size="8">Narrow the data to exactly</text>
  <text x="402" y="280" fill="#5E6062" font-size="8">what you need to see today.</text>

  <!-- Bottom tip -->
  <rect x="30" y="298" width="740" height="32" rx="6" fill="#EDF7E1"/>
  <text x="400" y="319" fill="#5a8a2f" font-size="11" font-weight="700" text-anchor="middle">Build 2-3 custom list views in your first week. You'll use them every single day.</text>
</svg>

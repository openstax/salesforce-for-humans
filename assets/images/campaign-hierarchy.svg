<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="400" fill="#F7F8FA" rx="8"/>
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">Four Tiers of Campaigns, and the Trail Under Them</text>
  <rect x="15" y="52" width="170" height="92" rx="8" fill="#fff" stroke="#0D2C6C" stroke-width="2"/>
  <rect x="15" y="52" width="170" height="22" rx="8" fill="#0D2C6C"/>
  <rect x="15" y="64" width="170" height="10" fill="#0D2C6C"/>
  <text x="100" y="68" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">TIER 1: PROGRAM</text>
  <text x="100" y="94" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">Instructor Marketing</text>
  <text x="100" y="108" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">(permanent, no year)</text>
  <text x="100" y="132" fill="#5E6062" font-size="9" text-anchor="middle">Created by Data Intelligence</text>
  <rect x="215" y="52" width="170" height="92" rx="8" fill="#fff" stroke="#0C9372" stroke-width="2"/>
  <rect x="215" y="52" width="170" height="22" rx="8" fill="#0C9372"/>
  <rect x="215" y="64" width="170" height="10" fill="#0C9372"/>
  <text x="300" y="68" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">TIER 2: INITIATIVE</text>
  <text x="300" y="94" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">HE Semester Engagement</text>
  <text x="300" y="108" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">(evergreen)</text>
  <text x="300" y="132" fill="#5E6062" font-size="9" text-anchor="middle">Created by Data Intelligence</text>
  <rect x="415" y="52" width="170" height="92" rx="8" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <rect x="415" y="52" width="170" height="22" rx="8" fill="#77AF42"/>
  <rect x="415" y="64" width="170" height="10" fill="#77AF42"/>
  <text x="500" y="68" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">TIER 3: SEASON</text>
  <text x="500" y="94" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">Spring 2026 HE Semester</text>
  <text x="500" y="108" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">Engagement</text>
  <text x="500" y="132" fill="#5E6062" font-size="9" text-anchor="middle">Created by marketers</text>
  <rect x="615" y="52" width="170" height="92" rx="8" fill="#fff" stroke="#F47641" stroke-width="2"/>
  <rect x="615" y="52" width="170" height="22" rx="8" fill="#F47641"/>
  <rect x="615" y="64" width="170" height="10" fill="#F47641"/>
  <text x="700" y="68" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">TIER 4: CHANNEL</text>
  <text x="700" y="94" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">Spring 2026 HE Semester</text>
  <text x="700" y="108" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">Engagement — Webinar</text>
  <text x="700" y="132" fill="#5E6062" font-size="9" text-anchor="middle">Created by marketers</text>
  <line x1="187" y1="98" x2="213" y2="98" stroke="#5E6062" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="387" y1="98" x2="413" y2="98" stroke="#5E6062" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="587" y1="98" x2="613" y2="98" stroke="#5E6062" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="172" fill="#5E6062" font-size="10" text-anchor="middle">Pardot forms, emails, and ON24 webinars attach to Tier 4. That is where members and attribution live.</text>
  <text x="400" y="204" fill="#0D2C6C" font-size="12" font-weight="900" text-anchor="middle">Campaign Member status on one Tier 4 campaign</text>
  <rect x="50" y="218" width="120" height="40" rx="6" fill="#fff" stroke="#5E6062" stroke-width="2"/>
  <text x="110" y="243" fill="#5E6062" font-size="12" font-weight="700" text-anchor="middle">Sent</text>
  <line x1="172" y1="238" x2="193" y2="238" stroke="#5E6062" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="195" y="218" width="120" height="40" rx="6" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <text x="255" y="243" fill="#77AF42" font-size="12" font-weight="700" text-anchor="middle">Opened</text>
  <line x1="317" y1="238" x2="338" y2="238" stroke="#5E6062" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="340" y="218" width="120" height="40" rx="6" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <text x="400" y="243" fill="#77AF42" font-size="12" font-weight="700" text-anchor="middle">Clicked</text>
  <line x1="462" y1="238" x2="483" y2="238" stroke="#5E6062" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="485" y="218" width="120" height="40" rx="6" fill="#fff" stroke="#0C9372" stroke-width="2"/>
  <text x="545" y="243" fill="#0C9372" font-size="12" font-weight="700" text-anchor="middle">Registered</text>
  <line x1="607" y1="238" x2="628" y2="238" stroke="#5E6062" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="630" y="218" width="120" height="40" rx="6" fill="#fff" stroke="#F47641" stroke-width="2"/>
  <text x="690" y="243" fill="#F47641" font-size="12" font-weight="700" text-anchor="middle">Attended</text>
  <rect x="40" y="280" width="720" height="100" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="302" fill="#0D2C6C" font-size="11" font-weight="700">Where credit goes</text>
  <text x="60" y="322" fill="#5E6062" font-size="10">Campaign Influence shares credit for an outcome across the campaigns a person touched.</text>
  <text x="60" y="338" fill="#5E6062" font-size="10">It works well for Assignable sales and is still thin for book adoptions.</text>
  <text x="60" y="354" fill="#5E6062" font-size="10">Member statuses are the evidence trail. If someone is missing or stuck on Sent, the trail goes cold.</text>
  <text x="60" y="370" fill="#9A9A9B" font-size="9" font-style="italic">Example data: tier names are real patterns; the campaign shown is illustrative.</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E6062"/></marker>
  </defs>
</svg>

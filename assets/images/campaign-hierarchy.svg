<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="340" fill="#F7F8FA" rx="8"/>
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">Campaign Hierarchy &amp; Attribution</text>

  <!-- Parent Campaign -->
  <rect x="250" y="48" width="300" height="44" rx="8" fill="#0D2C6C"/>
  <text x="400" y="66" fill="rgba(255,255,255,0.6)" font-size="8" text-anchor="middle">PARENT CAMPAIGN</text>
  <text x="400" y="82" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">Back to School Spring 2026</text>

  <!-- Lines to children -->
  <line x1="220" y1="92" x2="220" y2="118" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="400" y1="92" x2="400" y2="118" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="580" y1="92" x2="580" y2="118" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="220" y1="92" x2="580" y2="92" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Child Campaign 1 -->
  <rect x="110" y="118" width="180" height="38" rx="6" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <text x="200" y="134" fill="#9A9A9B" font-size="7" text-anchor="middle">CHILD CAMPAIGN</text>
  <text x="200" y="148" fill="#2d2d2d" font-size="10" font-weight="700" text-anchor="middle">HE Adoption Emails</text>

  <!-- Child Campaign 2 -->
  <rect x="310" y="118" width="180" height="38" rx="6" fill="#fff" stroke="#F47641" stroke-width="2"/>
  <text x="400" y="134" fill="#9A9A9B" font-size="7" text-anchor="middle">CHILD CAMPAIGN</text>
  <text x="400" y="148" fill="#2d2d2d" font-size="10" font-weight="700" text-anchor="middle">A&amp;P Webinar Series</text>

  <!-- Child Campaign 3 -->
  <rect x="510" y="118" width="180" height="38" rx="6" fill="#fff" stroke="#FDBD3E" stroke-width="2"/>
  <text x="600" y="134" fill="#9A9A9B" font-size="7" text-anchor="middle">CHILD CAMPAIGN</text>
  <text x="600" y="148" fill="#2d2d2d" font-size="10" font-weight="700" text-anchor="middle">K-12 Outreach</text>

  <!-- Attribution trail -->
  <text x="400" y="186" fill="#0D2C6C" font-size="12" font-weight="900" text-anchor="middle">The Attribution Trail</text>

  <!-- Flow: status progression -->
  <rect x="40" y="200" width="120" height="44" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="100" y="216" fill="#9A9A9B" font-size="8" text-anchor="middle">CAMPAIGN MEMBER</text>
  <text x="100" y="232" fill="#2d2d2d" font-size="11" font-weight="700" text-anchor="middle">Sent</text>

  <line x1="160" y1="222" x2="195" y2="222" stroke="#77AF42" stroke-width="2" marker-end="url(#attrArr)"/>

  <rect x="200" y="200" width="120" height="44" rx="6" fill="#fff" stroke="#77AF42" stroke-width="1.5"/>
  <text x="260" y="216" fill="#9A9A9B" font-size="8" text-anchor="middle">STATUS UPDATE</text>
  <text x="260" y="232" fill="#77AF42" font-size="11" font-weight="700" text-anchor="middle">Opened</text>

  <line x1="320" y1="222" x2="355" y2="222" stroke="#77AF42" stroke-width="2" marker-end="url(#attrArr)"/>

  <rect x="360" y="200" width="120" height="44" rx="6" fill="#fff" stroke="#77AF42" stroke-width="2"/>
  <text x="420" y="216" fill="#9A9A9B" font-size="8" text-anchor="middle">STATUS UPDATE</text>
  <text x="420" y="232" fill="#77AF42" font-size="11" font-weight="700" text-anchor="middle">Clicked</text>

  <line x1="480" y1="222" x2="515" y2="222" stroke="#F47641" stroke-width="2" marker-end="url(#attrArrO)"/>

  <rect x="520" y="200" width="130" height="44" rx="6" fill="#fff" stroke="#F47641" stroke-width="2"/>
  <text x="585" y="216" fill="#9A9A9B" font-size="8" text-anchor="middle">2 WEEKS LATER</text>
  <text x="585" y="232" fill="#F47641" font-size="11" font-weight="700" text-anchor="middle">Adoption ✓</text>

  <line x1="650" y1="222" x2="685" y2="222" stroke="#0D2C6C" stroke-width="2" marker-end="url(#attrArrB)"/>

  <rect x="690" y="200" width="90" height="44" rx="6" fill="#0D2C6C"/>
  <text x="735" y="218" fill="rgba(255,255,255,0.6)" font-size="8" text-anchor="middle">ATTRIBUTED</text>
  <text x="735" y="234" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">Campaign</text>
  <text x="735" y="244" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">gets credit</text>

  <!-- Bottom explanation -->
  <rect x="40" y="264" width="720" height="60" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="284" fill="#0D2C6C" font-size="10" font-weight="700">Why this matters to you:</text>
  <text x="60" y="300" fill="#5E6062" font-size="10">Campaign Member status changes create the evidence trail from marketing effort to adoption outcome.</text>
  <text x="60" y="314" fill="#5E6062" font-size="10">If statuses don't update, the trail goes cold and marketing can't prove what works.</text>

  <defs>
    <marker id="attrArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#77AF42"/></marker>
    <marker id="attrArrO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#F47641"/></marker>
    <marker id="attrArrB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0D2C6C"/></marker>
  </defs>
</svg>

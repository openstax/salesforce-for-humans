<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Lato, -apple-system, sans-serif">
  <defs>
    <marker id="pipeArr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#77AF42"/></marker>

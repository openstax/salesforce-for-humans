  <text x="354" y="338" fill="#0C9372" font-size="10" font-weight="900">$4,900 est. savings</text>
  <text x="354" y="350" fill="#9A9A9B" font-size="8">OpenStax Confirmed</text>

  <line x1="490" y1="323" x2="528" y2="323" stroke="#0D2C6C" stroke-width="2" marker-end="url(#pipeArrB)"/>

  <rect x="534" y="176" width="246" height="204" fill="#0D2C6C" rx="8"/>
  <text x="657" y="200" fill="rgba(255,255,255,0.6)" font-size="9" text-anchor="middle">CONFIRMED ADOPTIONS FEED</text>
  <text x="657" y="224" fill="#FDBD3E" font-size="13" font-weight="900" text-anchor="middle">Tableau's impact numbers</text>
  <text x="657" y="252" fill="#fff" font-size="10" text-anchor="middle">Built in Tableau, not summed</text>
  <text x="657" y="266" fill="#fff" font-size="10" text-anchor="middle">in a Salesforce report</text>
  <text x="657" y="294" fill="#fff" font-size="10" text-anchor="middle">Confirmed adoptions only,</text>
  <text x="657" y="308" fill="#fff" font-size="10" text-anchor="middle">test accounts excluded,</text>
  <text x="657" y="322" fill="#fff" font-size="10" text-anchor="middle">rollover applied</text>
  <text x="657" y="352" fill="rgba(255,255,255,0.65)" font-size="9" text-anchor="middle">Refreshed daily, about a day behind</text>

  <text x="20" y="378" fill="#9A9A9B" font-size="9" font-style="italic">Example data</text>

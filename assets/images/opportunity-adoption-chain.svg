  <text x="194" y="338" fill="#77AF42" font-size="10" font-weight="700">$4,550 est. savings</text>
  <text x="194" y="350" fill="#9A9A9B" font-size="8">OpenStax Confirmed</text>

  <rect x="340" y="290" width="150" height="66" rx="6" fill="#EDF7E1" stroke="#77AF42" stroke-width="2"/>

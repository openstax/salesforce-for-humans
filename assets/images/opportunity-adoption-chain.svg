<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="380" fill="#F7F8FA" rx="8"/>
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">The Pipeline: From Interest to Impact</text>

  <!-- Book Opp Pipeline -->
  <text x="40" y="58" fill="#0D2C6C" font-size="11" font-weight="900">Book Opportunity Stages</text>

  <!-- Stage boxes with connecting arrows -->
  <rect x="40" y="68" width="110" height="36" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="95" y="90" fill="#5E6062" font-size="10" font-weight="700" text-anchor="middle">Unconfirmed</text>

  <line x1="150" y1="86" x2="170" y2="86" stroke="#77AF42" stroke-width="2" marker-end="url(#pipeArr)"/>

  <rect x="175" y="68" width="110" height="36" rx="6" fill="#fff" stroke="#FDBD3E" stroke-width="1.5"/>
  <text x="230" y="90" fill="#5E6062" font-size="10" font-weight="700" text-anchor="middle">Assumed</text>

  <line x1="285" y1="86" x2="305" y2="86" stroke="#77AF42" stroke-width="2" marker-end="url(#pipeArr)"/>

  <rect x="310" y="68" width="110" height="36" rx="6" fill="#EDF7E1" stroke="#77AF42" stroke-width="2"/>
  <text x="365" y="90" fill="#77AF42" font-size="10" font-weight="900" text-anchor="middle">Active</text>

  <line x1="420" y1="86" x2="440" y2="86" stroke="#9A9A9B" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="445" y="68" width="110" height="36" rx="6" fill="#fff" stroke="#C22032" stroke-width="1.5"/>
  <text x="500" y="90" fill="#C22032" font-size="10" font-weight="700" text-anchor="middle">Lapsed</text>

  <!-- Stage accuracy callout -->
  <rect x="580" y="58" width="200" height="56" rx="6" fill="#FFF5EE" stroke="#F47641" stroke-width="1.5"/>
  <text x="596" y="78" fill="#F47641" font-size="10" font-weight="900">Stage accuracy matters</text>
  <text x="596" y="94" fill="#5E6062" font-size="9">Lapsed adoption not marked =</text>
  <text x="596" y="106" fill="#5E6062" font-size="9">inflated active count</text>

  <!-- Divider -->
  <line x1="40" y1="122" x2="760" y2="122" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Opportunity → Adoption relationship -->
  <text x="40" y="148" fill="#0D2C6C" font-size="11" font-weight="900">How Opportunities Connect to Impact</text>

  <!-- The Opportunity card -->
  <rect x="40" y="160" width="260" height="80" rx="6" fill="#fff" stroke="#F47641" stroke-width="2"/>
  <text x="56" y="178" fill="#9A9A9B" font-size="8" font-weight="700">OPPORTUNITY (Book Opp)</text>
  <text x="56" y="196" fill="#2d2d2d" font-size="12" font-weight="700">A&amp;P 2e — Dr. Rivera</text>
  <text x="56" y="212" fill="#5E6062" font-size="10">Central Arizona College</text>
  <text x="56" y="228" fill="#77AF42" font-size="10" font-weight="700">Stage: Active</text>

  <!-- Arrow down to adoptions -->
  <text x="170" y="256" fill="#0DC0DC" font-size="9" font-weight="700" text-anchor="middle">has child Adoption records ▼</text>

  <!-- Adoption cards (per year) -->
  <rect x="40" y="268" width="155" height="60" rx="6" fill="#fff" stroke="#0DC0DC" stroke-width="1.5"/>
  <text x="56" y="284" fill="#9A9A9B" font-size="8" font-weight="700">ADOPTION — FY24</text>
  <text x="56" y="300" fill="#2d2d2d" font-size="10">160 students</text>
  <text x="56" y="314" fill="#77AF42" font-size="10" font-weight="700">$25,600 saved</text>

  <rect x="205" y="268" width="155" height="60" rx="6" fill="#fff" stroke="#0DC0DC" stroke-width="1.5"/>
  <text x="221" y="284" fill="#9A9A9B" font-size="8" font-weight="700">ADOPTION — FY25</text>
  <text x="221" y="300" fill="#2d2d2d" font-size="10">175 students</text>
  <text x="221" y="314" fill="#77AF42" font-size="10" font-weight="700">$28,000 saved</text>

  <rect x="370" y="268" width="155" height="60" rx="6" fill="#EDF7E1" stroke="#77AF42" stroke-width="2"/>
  <text x="386" y="284" fill="#9A9A9B" font-size="8" font-weight="700">ADOPTION — FY26</text>
  <text x="386" y="300" fill="#2d2d2d" font-size="10" font-weight="700">180 students</text>
  <text x="386" y="314" fill="#77AF42" font-size="10" font-weight="900">$28,800 saved</text>

  <!-- Arrow to impact -->
  <line x1="535" y1="298" x2="575" y2="298" stroke="#0D2C6C" stroke-width="2" marker-end="url(#pipeArrB)"/>

  <!-- Mission impact box -->
  <rect x="580" y="150" width="190" height="200" fill="#0D2C6C" rx="8"/>
  <text x="675" y="176" fill="rgba(255,255,255,0.5)" font-size="9" text-anchor="middle">THESE ROLL UP INTO</text>

  <text x="675" y="206" fill="#FDBD3E" font-size="10" font-weight="700" text-anchor="middle">Mission Impact</text>

  <text x="675" y="234" fill="#fff" font-size="24" font-weight="900" text-anchor="middle">515</text>
  <text x="675" y="250" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle">students reached</text>

  <text x="675" y="282" fill="#77AF42" font-size="24" font-weight="900" text-anchor="middle">$82.4K</text>
  <text x="675" y="298" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle">savings generated</text>

  <text x="675" y="324" fill="rgba(255,255,255,0.4)" font-size="9" text-anchor="middle">from one instructor</text>
  <text x="675" y="338" fill="rgba(255,255,255,0.4)" font-size="9" text-anchor="middle">over three years</text>

  <!-- Bottom -->
  <text x="300" y="370" fill="#9A9A9B" font-size="10" font-style="italic" text-anchor="middle">The chain from your click to the headline number is direct and traceable.</text>
</svg>

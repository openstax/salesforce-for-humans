<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="460" fill="#F7F8FA" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">What a Spreadsheet Knows vs. What Salesforce Knows</text>

  <!-- LEFT: Spreadsheet -->
  <text x="200" y="62" fill="#C22032" font-size="12" font-weight="900" text-anchor="middle">THE SPREADSHEET</text>

  <!-- Spreadsheet grid -->
  <rect x="30" y="76" width="340" height="140" fill="#fff" rx="4" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Header row -->
  <rect x="30" y="76" width="340" height="26" fill="#f0f0f0" rx="4 4 0 0"/>
  <line x1="130" y1="76" x2="130" y2="216" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="240" y1="76" x2="240" y2="216" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="93" fill="#5E6062" font-size="10" font-weight="700" text-anchor="middle">Name</text>
  <text x="185" y="93" fill="#5E6062" font-size="10" font-weight="700" text-anchor="middle">Institution</text>
  <text x="310" y="93" fill="#5E6062" font-size="10" font-weight="700" text-anchor="middle">Email</text>

  <!-- Data rows -->
  <line x1="30" y1="102" x2="370" y2="102" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="119" fill="#2d2d2d" font-size="10" text-anchor="middle">Sam Okafor</text>
  <text x="185" y="119" fill="#2d2d2d" font-size="10" text-anchor="middle">Northgate State</text>
  <text x="310" y="119" fill="#2d2d2d" font-size="10" text-anchor="middle">sokafor@ngsu.example</text>

  <line x1="30" y1="128" x2="370" y2="128" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="30" y="128" width="340" height="26" fill="#FFF5F5"/>
  <text x="80" y="145" fill="#9A9A9B" font-size="10" text-anchor="middle">Maya Rivera</text>
  <text x="185" y="145" fill="#9A9A9B" font-size="10" text-anchor="middle">Cedar Bluff CC</text>
  <text x="310" y="145" fill="#9A9A9B" font-size="10" text-anchor="middle">mrivera@cbcc.example</text>

  <line x1="30" y1="154" x2="370" y2="154" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="171" fill="#2d2d2d" font-size="10" text-anchor="middle">Dana Brooks</text>
  <text x="185" y="171" fill="#2d2d2d" font-size="10" text-anchor="middle">Willow Creek HS</text>
  <text x="310" y="171" fill="#2d2d2d" font-size="10" text-anchor="middle">dbrooks@wcusd.example</text>

  <!-- Faded rows -->
  <line x1="30" y1="180" x2="370" y2="180" stroke="#E5E7EB" stroke-width="1"/>
  <text x="200" y="198" fill="#9A9A9B" font-size="10" font-style="italic" text-anchor="middle">...and that's all you get.</text>

  <!-- Problems list -->
  <g transform="translate(42, 232)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#C22032"/>
    <text x="7" y="11" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">✕</text>
    <text x="22" y="11" fill="#5E6062" font-size="10">No adoption history</text>
  </g>
  <g transform="translate(42, 254)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#C22032"/>
    <text x="7" y="11" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">✕</text>
    <text x="22" y="11" fill="#5E6062" font-size="10">No support case history</text>
  </g>
  <g transform="translate(42, 276)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#C22032"/>
    <text x="7" y="11" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">✕</text>
    <text x="22" y="11" fill="#5E6062" font-size="10">No engagement or campaign data</text>
  </g>
  <g transform="translate(42, 298)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#C22032"/>
    <text x="7" y="11" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">✕</text>
    <text x="22" y="11" fill="#5E6062" font-size="10">No version control — whose copy is current?</text>
  </g>
  <g transform="translate(42, 320)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#C22032"/>
    <text x="7" y="11" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">✕</text>
    <text x="22" y="11" fill="#5E6062" font-size="10">No access control or audit trail</text>
  </g>

  <!-- Verdict -->
  <rect x="50" y="350" width="300" height="28" rx="6" fill="#FFF0F0" stroke="#C22032" stroke-width="1"/>
  <text x="200" y="369" fill="#C22032" font-size="11" font-weight="700" text-anchor="middle">A spreadsheet gives you a row.</text>

  <!-- Divider -->
  <line x1="400" y1="62" x2="400" y2="390" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- RIGHT: Salesforce -->
  <text x="600" y="62" fill="#77AF42" font-size="12" font-weight="900" text-anchor="middle">SALESFORCE</text>

  <!-- Record card -->
  <rect x="430" y="76" width="340" height="260" fill="#fff" rx="6" stroke="#77AF42" stroke-width="2"/>

  <!-- Record header -->
  <rect x="430" y="76" width="340" height="40" fill="#0D2C6C" rx="6 6 0 0"/>
  <rect x="430" y="110" width="340" height="6" fill="#0D2C6C"/>
  <text x="446" y="92" fill="rgba(255,255,255,0.6)" font-size="8">CONTACT</text>
  <text x="446" y="108" fill="#fff" font-size="14" font-weight="700">Dr. Maya Rivera</text>

  <!-- Detail fields -->
  <text x="446" y="132" fill="#9A9A9B" font-size="8" font-weight="700">INSTITUTION</text>
  <text x="446" y="145" fill="#2d2d2d" font-size="10">Cedar Bluff Community College</text>

  <text x="640" y="132" fill="#9A9A9B" font-size="8" font-weight="700">SUBJECT</text>
  <text x="640" y="145" fill="#2d2d2d" font-size="10">A&amp;P</text>

  <text x="446" y="164" fill="#9A9A9B" font-size="8" font-weight="700">ADOPTION STATUS</text>
  <text x="446" y="177" fill="#77AF42" font-size="11" font-weight="700">Current Adopter</text>

  <text x="640" y="164" fill="#9A9A9B" font-size="8" font-weight="700">ENGAGEMENT TIER</text>
  <text x="640" y="177" fill="#2d2d2d" font-size="10">1 - Champion</text>

  <line x1="446" y1="186" x2="754" y2="186" stroke="#F0F0F0" stroke-width="1"/>

  <!-- Related data summary -->
  <text x="446" y="202" fill="#0D2C6C" font-size="9" font-weight="700">RELATED RECORDS</text>

  <rect x="446" y="210" width="140" height="18" rx="3" fill="#EDF7E1"/>
  <text x="454" y="223" fill="#5a8a2f" font-size="9">Adoption: A&amp;P 2e (3 yrs)</text>

  <rect x="596" y="210" width="155" height="18" rx="3" fill="#FFF5EE"/>
  <text x="604" y="223" fill="#F47641" font-size="9">2 webinars attended</text>

  <rect x="446" y="234" width="140" height="18" rx="3" fill="#E8F5F0"/>
  <text x="454" y="247" fill="#0C9372" font-size="9">1 Case (resolved same day)</text>

  <rect x="596" y="234" width="155" height="18" rx="3" fill="#EBF5FE"/>
  <text x="604" y="247" fill="#0D2C6C" font-size="9">5 emails (3 opened)</text>

  <rect x="446" y="258" width="304" height="18" rx="3" fill="#FFF9E5"/>
  <text x="454" y="271" fill="#0D2C6C" font-size="9">School: Canvas LMS · 2-year college · 3 other faculty contacts</text>

  <!-- Activity preview -->
  <line x1="446" y1="286" x2="754" y2="286" stroke="#F0F0F0" stroke-width="1"/>
  <text x="446" y="302" fill="#0D2C6C" font-size="9" font-weight="700">LAST ACTIVITY</text>
  <text x="446" y="316" fill="#5E6062" font-size="9">"Curious about Assignable; checking with her dept chair."</text>

  <!-- Verdict -->
  <rect x="450" y="350" width="300" height="28" rx="6" fill="#EDF7E1" stroke="#77AF42" stroke-width="1"/>
  <text x="600" y="369" fill="#5a8a2f" font-size="11" font-weight="700" text-anchor="middle">Salesforce gives you a story.</text>

  <!-- Bottom unified message -->
  <rect x="100" y="400" width="600" height="44" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="400" y="420" fill="#0D2C6C" font-size="11" font-weight="700" text-anchor="middle">Same person, very different amount of context.</text>
  <text x="400" y="436" fill="#5E6062" font-size="10" text-anchor="middle">The record shows what we already know before anyone picks up the phone.</text>
  <text x="780" y="452" fill="#9A9A9B" font-size="8" text-anchor="end">Example data</text>
</svg>

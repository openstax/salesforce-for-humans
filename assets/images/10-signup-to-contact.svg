<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Lato, -apple-system, sans-serif">
  <defs>
    <marker id="a10" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5E6062"/></marker>
  </defs>
  <rect width="800" height="340" fill="#F7F8FA" rx="8"/>
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">From Signup to Contact</text>

  <rect x="25" y="52" width="135" height="56" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="92" y="76" fill="#0D2C6C" font-size="11" font-weight="900" text-anchor="middle">Signup</text>
  <text x="92" y="94" fill="#5E6062" font-size="9" text-anchor="middle">on openstax.org</text>

  <rect x="195" y="52" width="135" height="56" rx="6" fill="#fff" stroke="#F47641" stroke-width="2"/>
  <text x="262" y="76" fill="#0D2C6C" font-size="11" font-weight="900" text-anchor="middle">Lead</text>
  <text x="262" y="94" fill="#5E6062" font-size="9" text-anchor="middle">with a Signup Date</text>

  <rect x="365" y="52" width="135" height="56" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="432" y="76" fill="#0D2C6C" font-size="11" font-weight="900" text-anchor="middle">School match</text>
  <text x="432" y="94" fill="#5E6062" font-size="9" text-anchor="middle">name, text, email domain</text>

  <rect x="535" y="52" width="135" height="56" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="602" y="76" fill="#0D2C6C" font-size="11" font-weight="900" text-anchor="middle">SheerID</text>
  <text x="602" y="94" fill="#5E6062" font-size="9" text-anchor="middle">faculty check</text>

  <line x1="160" y1="80" x2="193" y2="80" stroke="#5E6062" stroke-width="1.5" marker-end="url(#a10)"/>
  <line x1="330" y1="80" x2="363" y2="80" stroke="#5E6062" stroke-width="1.5" marker-end="url(#a10)"/>
  <line x1="500" y1="80" x2="533" y2="80" stroke="#5E6062" stroke-width="1.5" marker-end="url(#a10)"/>

  <rect x="355" y="150" width="155" height="58" rx="6" fill="#FFF5EE" stroke="#F47641" stroke-width="1.5"/>
  <text x="432" y="172" fill="#F47641" font-size="10" font-weight="900" text-anchor="middle">No match</text>
  <text x="432" y="188" fill="#5E6062" font-size="9" text-anchor="middle">"Find Me A Home", SDR Queue</text>
  <text x="432" y="200" fill="#5E6062" font-size="9" text-anchor="middle">picks the school</text>
  <line x1="432" y1="108" x2="432" y2="148" stroke="#F47641" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a10)"/>

  <rect x="540" y="150" width="100" height="58" rx="6" fill="#EDF7E1" stroke="#77AF42" stroke-width="1.5"/>
  <text x="590" y="174" fill="#0C9372" font-size="10" font-weight="900" text-anchor="middle">Auto confirm</text>
  <text x="590" y="192" fill="#5E6062" font-size="9" text-anchor="middle">most people</text>

  <rect x="660" y="150" width="125" height="58" rx="6" fill="#fff" stroke="#FDBD3E" stroke-width="2"/>
  <text x="722" y="170" fill="#0D2C6C" font-size="10" font-weight="900" text-anchor="middle">AI reviews</text>
  <text x="722" y="185" fill="#5E6062" font-size="9" text-anchor="middle">a person decides</text>
  <text x="722" y="199" fill="#5E6062" font-size="9" text-anchor="middle">(Verify action)</text>

  <line x1="590" y1="108" x2="590" y2="148" stroke="#5E6062" stroke-width="1.5" marker-end="url(#a10)"/>
  <line x1="630" y1="108" x2="700" y2="148" stroke="#5E6062" stroke-width="1.5" marker-end="url(#a10)"/>

  <rect x="470" y="262" width="170" height="52" rx="8" fill="#0D2C6C"/>
  <text x="555" y="284" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">Contact</text>
  <text x="555" y="301" fill="rgba(255,255,255,0.75)" font-size="9" text-anchor="middle">on the school's Account (or merged)</text>

  <rect x="670" y="262" width="115" height="52" rx="8" fill="#fff" stroke="#9A9A9B" stroke-width="1.5"/>
  <text x="727" y="284" fill="#5E6062" font-size="12" font-weight="900" text-anchor="middle">Unqualified</text>
  <text x="727" y="301" fill="#5E6062" font-size="9" text-anchor="middle">rejection email sent</text>

  <line x1="570" y1="208" x2="545" y2="260" stroke="#77AF42" stroke-width="1.5" marker-end="url(#a10)"/>
  <line x1="700" y1="208" x2="590" y2="260" stroke="#77AF42" stroke-width="1.5" marker-end="url(#a10)"/>
  <text x="680" y="244" fill="#0C9372" font-size="9" font-weight="700" text-anchor="end">confirm</text>
  <line x1="740" y1="208" x2="735" y2="260" stroke="#9A9A9B" stroke-width="1.5" marker-end="url(#a10)"/>
  <text x="752" y="240" fill="#5E6062" font-size="9" font-weight="700">reject</text>

  <text x="25" y="324" fill="#5E6062" font-size="9" font-style="italic">The AI advises. A person decides.</text>
</svg>

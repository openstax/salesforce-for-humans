  <rect x="248" y="170" width="8" height="8" rx="2" fill="#FDBD3E"/>
  <text x="262" y="178" fill="#5E6062" font-size="9">Update HCC adoption records</text>
  <rect x="248" y="186" width="8" height="8" rx="2" fill="#77AF42"/>

  <rect x="290" y="238" width="200" height="26" rx="4" fill="#FFF5EE"/>
  <text x="306" y="256" fill="#F47641" font-size="10">Tasks keep you on track daily</text>
  
  <rect x="530" y="238" width="240" height="26" rx="4" fill="#EBF5FE"/>
  <text x="546" y="256" fill="#0D2C6C" font-size="10">Recent records = quick backtracking</text>

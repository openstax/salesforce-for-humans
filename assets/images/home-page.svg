  <text x="252" y="214" fill="#0C9372" font-size="9" font-weight="700">View All →</text>
  
  <!-- Recent Records sidebar -->
  <rect x="450" y="70" width="316" height="154" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="466" y="90" fill="#0D2C6C" font-size="10" font-weight="700">RECENT RECORDS</text>
  
  <text x="466" y="112" fill="#0C9372" font-size="9" font-weight="700">Central Arizona College</text>
  <text x="620" y="112" fill="#9A9A9B" font-size="8">Account</text>
  <line x1="466" y1="120" x2="750" y2="120" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="466" y="136" fill="#0C9372" font-size="9" font-weight="700">Dr. Maria Chen</text>
  <text x="620" y="136" fill="#9A9A9B" font-size="8">Contact</text>
  <line x1="466" y1="144" x2="750" y2="144" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="466" y="160" fill="#0C9372" font-size="9" font-weight="700">Case #00451922</text>
  <text x="620" y="160" fill="#9A9A9B" font-size="8">Case</text>
  <line x1="466" y1="168" x2="750" y2="168" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="466" y="184" fill="#0C9372" font-size="9" font-weight="700">Biology 2e - Fall Push</text>
  <text x="620" y="184" fill="#9A9A9B" font-size="8">Campaign</text>
  

  <rect x="100" y="150" width="16" height="44" rx="2" fill="#77AF42" opacity="0.7"/>
  <rect x="124" y="158" width="16" height="36" rx="2" fill="#77AF42" opacity="0.8"/>
  <rect x="148" y="148" width="16" height="46" rx="2" fill="#77AF42"/>
  <text x="52" y="210" fill="#9A9A9B" font-size="8">Mon    Tue    Wed    Thu    Fri</text>
  
  <rect x="236" y="124" width="200" height="100" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="252" y="144" fill="#0D2C6C" font-size="10" font-weight="700">My Tasks</text>
  <rect x="248" y="154" width="8" height="8" rx="2" fill="#F47641"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="280" fill="#F7F8FA" rx="8"/>
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">Power User Cheat Sheet</text>

  <!-- Tip 1: Inline Editing -->
  <rect x="20" y="48" width="185" height="210" fill="#fff" rx="6" stroke="#77AF42" stroke-width="2"/>
  <rect x="20" y="48" width="185" height="30" fill="#77AF42" rx="6 6 0 0"/>
  <rect x="20" y="72" width="185" height="6" fill="#77AF42"/>
  <text x="112" y="68" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">Inline Editing</text>

  <!-- Mini list view with edit state -->
  <rect x="30" y="86" width="165" height="14" fill="#F7F8FA" rx="2"/>
  <text x="38" y="96" fill="#5E6062" font-size="7" font-weight="700">Name</text>
  <text x="115" y="96" fill="#5E6062" font-size="7" font-weight="700">LMS</text>

  <text x="38" y="114" fill="#0C9372" font-size="8">Cedar Bluff</text>
  <text x="115" y="114" fill="#2d2d2d" font-size="8">Canvas</text>

  <!-- Editing state on second row -->
  <text x="38" y="132" fill="#0C9372" font-size="8">Lakeshore</text>
  <rect x="110" y="122" width="55" height="16" rx="2" fill="#fff" stroke="#77AF42" stroke-width="1.5"/>
  <text x="116" y="133" fill="#2d2d2d" font-size="8">D2L|</text>

  <text x="38" y="150" fill="#0C9372" font-size="8">Pine Hollow</text>
  <text x="115" y="150" fill="#2d2d2d" font-size="8">Canvas</text>

  <line x1="36" y1="160" x2="180" y2="160" stroke="#F0F0F0" stroke-width="1"/>

  <text x="38" y="178" fill="#5E6062" font-size="8">Double-click any field</text>
  <text x="38" y="192" fill="#5E6062" font-size="8">in a list view to edit</text>
  <text x="38" y="206" fill="#5E6062" font-size="8">without opening the</text>
  <text x="38" y="220" fill="#5E6062" font-size="8">record page.</text>

  <text x="112" y="248" fill="#77AF42" font-size="9" font-weight="700" text-anchor="middle">Fix a field with no page load</text>

  <!-- Tip 2: Pinned Views -->
  <rect x="215" y="48" width="185" height="210" fill="#fff" rx="6" stroke="#F47641" stroke-width="2"/>
  <rect x="215" y="48" width="185" height="30" fill="#F47641" rx="6 6 0 0"/>
  <rect x="215" y="72" width="185" height="6" fill="#F47641"/>
  <text x="307" y="68" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">Pinned Views</text>

  <!-- View dropdown mockup -->
  <rect x="225" y="86" width="165" height="24" rx="4" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="233" y="102" fill="#2d2d2d" font-size="9" font-weight="700">My A/B Fit Schools</text>
  <text x="382" y="102" fill="#9A9A9B" font-size="8">▼</text>

  <!-- Pin icon -->
  <rect x="260" y="118" width="90" height="20" rx="10" fill="#FFF5EE"/>
  <text x="305" y="132" fill="#9A4A1E" font-size="9" font-weight="700" text-anchor="middle">Pin this list</text>

  <line x1="231" y1="148" x2="384" y2="148" stroke="#F0F0F0" stroke-width="1"/>

  <text x="233" y="168" fill="#5E6062" font-size="8">Pin your best list view</text>
  <text x="233" y="182" fill="#5E6062" font-size="8">as the default for that</text>
  <text x="233" y="196" fill="#5E6062" font-size="8">object. It opens first</text>
  <text x="233" y="210" fill="#5E6062" font-size="8">every time you navigate</text>
  <text x="233" y="224" fill="#5E6062" font-size="8">to that tab.</text>

  <text x="307" y="248" fill="#F47641" font-size="9" font-weight="700" text-anchor="middle">Your daily view, first</text>

  <!-- Tip 3: Favorites -->
  <rect x="410" y="48" width="185" height="210" fill="#fff" rx="6" stroke="#FDBD3E" stroke-width="2"/>
  <rect x="410" y="48" width="185" height="30" fill="#FDBD3E" rx="6 6 0 0"/>
  <rect x="410" y="72" width="185" height="6" fill="#FDBD3E"/>
  <text x="502" y="68" fill="#0D2C6C" font-size="10" font-weight="900" text-anchor="middle">Favorites</text>

  <text x="502" y="106" fill="#C98A00" font-size="26" text-anchor="middle">★</text>
  <text x="502" y="118" fill="#5E6062" font-size="8" text-anchor="middle">in the Salesforce header</text>

  <rect x="426" y="126" width="153" height="16" rx="3" fill="#FFF9E5"/>
  <text x="434" y="137" fill="#5E6062" font-size="8">★ Cedar Bluff Community College</text>
  <rect x="426" y="146" width="153" height="16" rx="3" fill="#FFF9E5"/>
  <text x="434" y="157" fill="#5E6062" font-size="8">★ My A/B Fit Schools</text>
  <rect x="426" y="166" width="153" height="16" rx="3" fill="#FFF9E5"/>
  <text x="434" y="177" fill="#5E6062" font-size="8">★ My open Cases</text>

  <line x1="426" y1="192" x2="573" y2="192" stroke="#F0F0F0" stroke-width="1"/>
  <text x="428" y="208" fill="#5E6062" font-size="8">Star a record, list view, or</text>
  <text x="428" y="220" fill="#5E6062" font-size="8">report. It is Salesforce's star,</text>
  <text x="428" y="232" fill="#5E6062" font-size="8">not your browser's.</text>

  <text x="502" y="250" fill="#0D2C6C" font-size="9" font-weight="700" text-anchor="middle">Skip the search entirely</text>

  <!-- Tip 4: Keyboard -->
  <rect x="605" y="48" width="175" height="210" fill="#fff" rx="6" stroke="#0D2C6C" stroke-width="2"/>
  <rect x="605" y="48" width="175" height="30" fill="#0D2C6C" rx="6 6 0 0"/>
  <rect x="605" y="72" width="175" height="6" fill="#0D2C6C"/>
  <text x="692" y="68" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">Shortcuts</text>

  <rect x="617" y="92" width="62" height="26" rx="4" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="648" y="109" fill="#0D2C6C" font-size="10" font-weight="900" text-anchor="middle">Ctrl + /</text>
  <text x="692" y="109" fill="#5E6062" font-size="9" text-anchor="middle">or</text>
  <rect x="705" y="92" width="62" height="26" rx="4" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="736" y="109" fill="#0D2C6C" font-size="10" font-weight="900" text-anchor="middle">⌘ + /</text>

  <text x="692" y="140" fill="#2d2d2d" font-size="9" font-weight="700" text-anchor="middle">Show all shortcuts</text>
  <text x="692" y="153" fill="#5E6062" font-size="8" text-anchor="middle">available on this page</text>

  <line x1="621" y1="168" x2="764" y2="168" stroke="#F0F0F0" stroke-width="1"/>

  <text x="621" y="188" fill="#5E6062" font-size="8">The list changes by page, so</text>
  <text x="621" y="200" fill="#5E6062" font-size="8">open it where you are working</text>
  <text x="621" y="212" fill="#5E6062" font-size="8">and pick up what is useful.</text>

  <text x="692" y="250" fill="#0D2C6C" font-size="9" font-weight="700" text-anchor="middle">One shortcut to learn the rest</text>
</svg>

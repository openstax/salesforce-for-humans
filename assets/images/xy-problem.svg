<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="300" fill="#F7F8FA" rx="8"/>
  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">The XY Problem: Share the Problem, Not Your Guess at the Solution</text>

  <!-- BAD REQUEST (left) -->
  <text x="200" y="58" fill="#C22032" font-size="11" font-weight="900" text-anchor="middle">PRESCRIBING THE SOLUTION</text>

  <rect x="30" y="70" width="340" height="100" fill="#fff" rx="6" stroke="#C22032" stroke-width="2"/>
  <rect x="30" y="70" width="340" height="26" fill="#FFF0F0" rx="6 6 0 0"/>
  <rect x="30" y="90" width="340" height="6" fill="#FFF0F0"/>
  <text x="46" y="88" fill="#C22032" font-size="9" font-weight="700">REQUEST TO ADMIN</text>

  <text x="46" y="114" fill="#2d2d2d" font-size="11">"Can you add a field to Account called</text>
  <text x="46" y="130" fill="#2d2d2d" font-size="11">'Priority Level' with values High,</text>
  <text x="46" y="146" fill="#2d2d2d" font-size="11">Medium, and Low?"</text>

  <!-- Problem -->
  <rect x="46" y="178" width="308" height="36" rx="4" fill="#FFF0F0"/>
  <text x="62" y="194" fill="#C22032" font-size="9" font-weight="700">WHAT GOES WRONG:</text>
  <text x="62" y="208" fill="#5E6062" font-size="9">Admin builds exactly this. It might be the wrong solution entirely.</text>

  <!-- Arrow showing the real need is hidden -->
  <text x="200" y="232" fill="#C22032" font-size="9" font-style="italic" text-anchor="middle">The actual need is invisible.</text>

  <!-- Divider -->
  <line x1="400" y1="54" x2="400" y2="250" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- GOOD REQUEST (right) -->
  <text x="600" y="58" fill="#77AF42" font-size="11" font-weight="900" text-anchor="middle">SHARING THE PROBLEM</text>

  <rect x="430" y="70" width="340" height="136" fill="#fff" rx="6" stroke="#77AF42" stroke-width="2"/>
  <rect x="430" y="70" width="340" height="26" fill="#EDF7E1" rx="6 6 0 0"/>
  <rect x="430" y="90" width="340" height="6" fill="#EDF7E1"/>
  <text x="446" y="88" fill="#5a8a2f" font-size="9" font-weight="700">REQUEST TO ADMIN</text>

  <text x="446" y="114" fill="#2d2d2d" font-size="11">"I need a faster way to pick which</text>
  <text x="446" y="130" fill="#2d2d2d" font-size="11">schools to call first about Assignable</text>
  <text x="446" y="146" fill="#2d2d2d" font-size="11">next semester. Today I check adoption</text>
  <text x="446" y="162" fill="#2d2d2d" font-size="11">history, LMS, and enrollment, one school</text>
  <text x="446" y="178" fill="#2d2d2d" font-size="11">at a time. Can you help?"</text>

  <!-- Possible solutions -->
  <text x="600" y="226" fill="#77AF42" font-size="10" font-weight="900" text-anchor="middle">Now the admin can build the RIGHT thing:</text>

  <rect x="436" y="238" width="96" height="22" rx="4" fill="#EDF7E1"/>
  <text x="484" y="253" fill="#5a8a2f" font-size="8" font-weight="700" text-anchor="middle">Existing field</text>

  <rect x="540" y="238" width="80" height="22" rx="4" fill="#EDF7E1"/>
  <text x="580" y="253" fill="#5a8a2f" font-size="8" font-weight="700" text-anchor="middle">List view</text>

  <rect x="628" y="238" width="60" height="22" rx="4" fill="#EDF7E1"/>
  <text x="658" y="253" fill="#5a8a2f" font-size="8" font-weight="700" text-anchor="middle">Report</text>

  <rect x="696" y="238" width="68" height="22" rx="4" fill="#EDF7E1"/>
  <text x="730" y="253" fill="#5a8a2f" font-size="8" font-weight="700" text-anchor="middle">Dashboard</text>

  <!-- Bottom -->
  <rect x="100" y="274" width="600" height="20" rx="4" fill="#FFF9E5"/>
  <text x="400" y="289" fill="#0D2C6C" font-size="10" font-weight="700" text-anchor="middle">Sharing the problem gives your admin the freedom to build the right solution.</text>
</svg>

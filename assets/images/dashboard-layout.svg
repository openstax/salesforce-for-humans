<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Lato, -apple-system, sans-serif">
  <rect width="800" height="360" fill="#F7F8FA" rx="8"/>

  <text x="400" y="28" fill="#0D2C6C" font-size="15" font-weight="900" text-anchor="middle">Dashboards: The Visual Layer</text>
  <text x="400" y="44" fill="#9A9A9B" font-size="10" text-anchor="middle">Glance at the numbers. Spot anything unusual. Click to drill into the details. Example data, not real totals.</text>

  <!-- Dashboard frame -->
  <rect x="20" y="56" width="560" height="270" fill="#fff" rx="6" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Dashboard title -->
  <rect x="20" y="56" width="560" height="30" fill="#0D2C6C" rx="6 6 0 0"/>
  <rect x="20" y="80" width="560" height="6" fill="#0D2C6C"/>
  <text x="38" y="76" fill="#fff" font-size="11" font-weight="700">Adoption Dashboard — School Year 2026 - 27</text>

  <!-- Component 1: Big number -->
  <rect x="30" y="92" width="130" height="80" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="46" y="110" fill="#9A9A9B" font-size="8" font-weight="700">STUDENTS (CONFIRMED)</text>
  <text x="95" y="148" fill="#77AF42" font-size="30" font-weight="900" text-anchor="middle">1,240</text>
  <text x="95" y="164" fill="#77AF42" font-size="9" text-anchor="middle">Example data</text>

  <!-- Component 2: Bar chart -->
  <rect x="170" y="92" width="200" height="80" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="186" y="110" fill="#9A9A9B" font-size="8" font-weight="700">ADOPTIONS BY MARKET</text>
  <!-- Bar: HE -->
  <rect x="192" y="120" width="80" height="14" rx="2" fill="#77AF42"/>
  <text x="186" y="130" fill="#5E6062" font-size="8" text-anchor="end">HE</text>
  <!-- Bar: K-12 -->
  <rect x="192" y="138" width="48" height="14" rx="2" fill="#0DC0DC"/>
  <text x="186" y="148" fill="#5E6062" font-size="8" text-anchor="end">K-12</text>

  <!-- Highlight/click state on K-12 bar -->
  <rect x="192" y="138" width="48" height="14" rx="2" fill="none" stroke="#F47641" stroke-width="2"/>

  <!-- Component 3: Pie chart -->
  <rect x="380" y="92" width="190" height="80" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="396" y="110" fill="#9A9A9B" font-size="8" font-weight="700">CONFIRMATION TYPE</text>
  <!-- Simplified pie -->
  <g transform="translate(-16,0)"><circle cx="440" cy="148" r="24" fill="#77AF42"/>
  <path d="M 440 148 L 440 124 A 24 24 0 0 1 462 140 Z" fill="#F47641"/>
  <path d="M 440 148 L 462 140 A 24 24 0 0 1 458 160 Z" fill="#FDBD3E"/></g>
  <!-- Legend -->
  <rect x="458" y="128" width="8" height="8" rx="1" fill="#77AF42"/>
  <text x="470" y="136" fill="#5E6062" font-size="7.5">OpenStax Confirmed</text>
  <rect x="458" y="142" width="8" height="8" rx="1" fill="#F47641"/>
  <text x="470" y="150" fill="#5E6062" font-size="7.5">Third Party Confirmed</text>
  <rect x="458" y="156" width="8" height="8" rx="1" fill="#FDBD3E"/>
  <text x="470" y="164" fill="#5E6062" font-size="7.5">User Behavior Informed</text>

  <!-- Component 4: Table -->
  <rect x="30" y="180" width="540" height="138" fill="#F7F8FA" rx="4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="46" y="198" fill="#9A9A9B" font-size="8" font-weight="700">TOP ADOPTED TITLES</text>

  <rect x="36" y="206" width="528" height="18" fill="#EBF5FE"/>
  <text x="46" y="218" fill="#0D2C6C" font-size="8" font-weight="700">Title</text>
  <text x="240" y="218" fill="#0D2C6C" font-size="8" font-weight="700">Adoptions</text>
  <text x="330" y="218" fill="#0D2C6C" font-size="8" font-weight="700">Students</text>
  <text x="430" y="218" fill="#0D2C6C" font-size="8" font-weight="700">Savings</text>

  <text x="46" y="238" fill="#2d2d2d" font-size="9">Biology 2e</text>
  <text x="240" y="238" fill="#2d2d2d" font-size="9">42</text>
  <text x="330" y="238" fill="#2d2d2d" font-size="9">3,800</text>
  <text x="430" y="238" fill="#2d2d2d" font-size="9">$608K</text>

  <text x="46" y="256" fill="#2d2d2d" font-size="9">Anatomy &amp; Physiology 2e</text>
  <text x="240" y="256" fill="#2d2d2d" font-size="9">31</text>
  <text x="330" y="256" fill="#2d2d2d" font-size="9">2,950</text>
  <text x="430" y="256" fill="#2d2d2d" font-size="9">$472K</text>

  <text x="46" y="274" fill="#2d2d2d" font-size="9">Introductory Statistics 2e</text>
  <text x="240" y="274" fill="#2d2d2d" font-size="9">28</text>
  <text x="330" y="274" fill="#2d2d2d" font-size="9">2,600</text>
  <text x="430" y="274" fill="#2d2d2d" font-size="9">$416K</text>

  <text x="46" y="292" fill="#9A9A9B" font-size="9" font-style="italic">+ more titles (Example data)</text>

  <!-- DRILL DOWN callout -->

  <rect x="600" y="88" width="180" height="90" fill="#fff" rx="6" stroke="#F47641" stroke-width="2"/>
  <rect x="600" y="88" width="180" height="24" fill="#F47641" rx="6 6 0 0"/>
  <rect x="600" y="106" width="180" height="6" fill="#F47641"/>
  <text x="690" y="104" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Click to Drill Down</text>

  <text x="616" y="130" fill="#5E6062" font-size="10">Most dashboard components</text>
  <text x="616" y="144" fill="#5E6062" font-size="10">are clickable. Click a bar, a</text>
  <text x="616" y="158" fill="#5E6062" font-size="10">slice, or a row to see the</text>
  <text x="616" y="172" fill="#5E6062" font-size="10" font-weight="700">underlying report.</text>

  <!-- Arrow from bar to callout -->

  <!-- Bottom: how to ask -->
  <rect x="600" y="200" width="180" height="120" fill="#EDF7E1" rx="6" stroke="#77AF42" stroke-width="1.5"/>
  <text x="616" y="220" fill="#5a8a2f" font-size="10" font-weight="900">Asking for a Report?</text>
  <text x="616" y="240" fill="#5E6062" font-size="9" font-weight="700">1. What you want to see</text>
  <text x="624" y="253" fill="#5E6062" font-size="8">"Count of Adoptions..."</text>
  <text x="616" y="270" fill="#5E6062" font-size="9" font-weight="700">2. How to group it</text>
  <text x="624" y="283" fill="#5E6062" font-size="8">"...by school and status"</text>
  <text x="616" y="300" fill="#5E6062" font-size="9" font-weight="700">3. How to filter it</text>
  <text x="624" y="313" fill="#5E6062" font-size="8">"...for 2026 - 27, HE only"</text>

  <!-- Bottom message -->
  <text x="300" y="350" fill="#9A9A9B" font-size="10" font-style="italic" text-anchor="middle">Dashboards are the surface. Reports are the depth.</text>

  <defs>
    <marker id="drillArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F47641"/>
    </marker>
  </defs>
</svg>
